<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Kurs IDR ↔ PHP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --green-950: #173700;
      --green-900: #214900;
      --green-800: #315d12;
      --green-500: #8cda62;
      --green-100: #eaf8df;
      --ink: #17230f;
      --muted: #64715e;
      --line: #d7ddcf;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding-bottom: 48px;
      background: #f7f8f5;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      position: relative;
      z-index: 1;
      background: var(--green-950);
      color: #fff;
    }

    .nav-inner {
      max-width: 1120px;
      min-height: 58px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--green-500);
      color: var(--green-950);
      font-size: 17px;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      margin-right: auto;
      margin-left: 32px;
      color: #d4e5c7;
      font-size: 12px;
      font-weight: 600;
    }

    .nav-links a { color: inherit; text-decoration: none; }
    .nav-links a:hover { color: #fff; }

    .nav-actions { display: flex; gap: 8px; }

    .nav-action {
      border: 1px solid #58763e;
      border-radius: 8px;
      padding: 7px 10px;
      background: transparent;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .nav-action:hover { background: #2b5010; }

    .hero {
      min-height: 368px;
      padding: 34px 16px 70px;
      background: var(--green-950);
    }

    .converter {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 24px 22px 20px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 42px rgb(15 32 4 / 20%);
    }

    .rate-heading {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .rate-value {
      margin: 7px 0 22px;
      text-align: center;
      color: var(--green-950);
      font-size: 14px;
      font-weight: 700;
    }

    .amount-label {
      display: block;
      margin-bottom: 5px;
      color: #3d4937;
      font-size: 12px;
      font-weight: 600;
    }

    .amount-box {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #b5bcb0;
      border-radius: 9px;
      padding: 0 10px;
      background: #fff;
    }

    .amount-box:focus-within {
      border: 2px solid var(--green-900);
      padding: 0 9px;
    }

    .amount-box.source { border: 2px solid var(--green-900); }

    .amount-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #182312;
      font-size: 19px;
      font-weight: 600;
    }

    .amount-box input::placeholder { color: #9aa294; }

    .currency {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #26331f;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .currency-flag {
      position: relative;
      width: 20px;
      height: 15px;
      display: inline-block;
      flex: none;
      overflow: hidden;
      border-radius: 2px;
    }

    .flag-id { background: linear-gradient(to bottom, #e11d48 50%, #fff 50%); }

    .flag-ph { background: linear-gradient(to bottom, #1765bd 50%, #dc2638 50%); }

    .flag-ph::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 7.5px solid transparent;
      border-bottom: 7.5px solid transparent;
      border-left: 9px solid #fff;
      content: "";
    }

    .swap-wrap {
      height: 56px;
      display: grid;
      place-items: center;
    }

    .swap-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--green-500);
      color: var(--green-950);
      font-size: 19px;
      font-weight: 700;
      transition: transform .18s ease, background .18s ease;
    }

    .swap-button:hover { transform: rotate(180deg); background: #79ce4c; }

    .result-amount {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #b5bcb0;
      border-radius: 9px;
      padding: 0 10px;
      background: #fff;
    }

    .result-value {
      overflow-wrap: anywhere;
      color: #26331f;
      font-size: 18px;
      font-weight: 700;
    }

    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .quick-button {
      border: 1px solid #dfe5da;
      border-radius: 999px;
      padding: 5px 9px;
      background: #f7f9f4;
      color: #4a5743;
      font-size: 11px;
      font-weight: 600;
    }

    .quick-button:hover { border-color: #9ed580; background: var(--green-100); }

    .direction-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .direction-button, .mode-button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 8px;
      background: #fff;
      color: #56614f;
      font-size: 12px;
      font-weight: 600;
    }

    .direction-button.active, .mode-button.active {
      border-color: var(--green-800);
      background: var(--green-100);
      color: var(--green-900);
    }

    .converter-actions {
      display: grid;
      gap: 7px;
      margin-top: 12px;
    }

    .primary-action, .secondary-action {
      min-height: 42px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .primary-action {
      border: 1px solid var(--green-500);
      background: var(--green-500);
      color: var(--green-950);
    }

    .primary-action:hover { background: #79ce4c; }

    .secondary-action {
      border: 1px solid var(--green-900);
      background: #fff;
      color: var(--green-900);
    }

    .secondary-action:hover { background: #f2f8ed; }

    .status-line {
      margin: 10px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    .below-content {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 760px);
      margin: -38px auto 0;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
    }

    .section-heading h2 {
      margin: 0;
      color: #26331f;
      font-size: 17px;
      font-weight: 700;
    }

    .section-heading span {
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--green-100);
      color: var(--green-900);
      font-size: 10px;
      font-weight: 700;
    }

    .support-card {
      margin-bottom: 16px;
      border: 1px solid #e0e5db;
      border-radius: 16px;
      padding: 18px;
      background: #fff;
      box-shadow: 0 5px 18px rgb(20 35 10 / 4%);
    }

    .support-card h3 {
      margin: 0 0 12px;
      color: #26331f;
      font-size: 14px;
      font-weight: 700;
    }

    .mode-options { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    .mode-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px 12px;
    }

    .mode-button span:last-child {
      border-radius: 6px;
      padding: 3px 6px;
      background: rgb(255 255 255 / 75%);
      font-size: 10px;
    }

    .rates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .live-rate-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 0;
      border-radius: 10px;
      padding: 11px 12px;
      background: #f5f8f1;
    }

    .live-rate-info { min-width: 0; }
    .live-rate-info strong { display: block; color: var(--green-900); font-size: 12px; }
    .live-rate-info span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }

    .refresh-button {
      flex: none;
      border: 1px solid var(--green-800);
      border-radius: 999px;
      padding: 7px 10px;
      background: #fff;
      color: var(--green-900);
      font-size: 11px;
      font-weight: 600;
    }

    .refresh-button:hover { background: var(--green-100); }
    .refresh-button:disabled { cursor: wait; opacity: .6; }

    .mode-button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .rate-input-wrap { position: relative; }

    .rate-input-wrap span {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #687363;
      font-size: 12px;
      font-weight: 600;
    }

    .rate-input-wrap input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cbd2c5;
      border-radius: 8px;
      padding: 0 10px 0 34px;
      outline: 0;
      color: #26331f;
      font-size: 14px;
      font-weight: 600;
    }

    .rate-input-wrap input:focus {
      border-color: var(--green-800);
      box-shadow: 0 0 0 3px rgb(140 218 98 / 20%);
    }

    .rate-field label { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 600; }
    .rate-field p { margin: 5px 0 0; color: #788273; font-size: 10px; }

    .spread-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
      border-top: 1px solid #edf0ea;
      padding-top: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .spread-row strong { color: var(--ink); }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin: 0;
      font-size: 12px;
    }

    .detail-grid dt { color: var(--muted); }
    .detail-grid dd { margin: 0; text-align: right; font-weight: 600; }

    #btnCopy {
      width: 100%;
      margin-top: 14px;
      border: 1px solid var(--green-900);
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--green-900);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    #btnCopy:hover { background: var(--green-950); }

    @media (max-width: 640px) {
      .nav-inner { min-height: 54px; padding: 9px 14px; }
      .nav-links { display: none; }
      .brand { font-size: 13px; }
      .brand-mark { width: 29px; height: 29px; }
      .nav-action { padding: 7px 8px; font-size: 11px; }
      .hero { min-height: 350px; padding: 24px 12px 58px; }
      .converter { padding: 21px 16px 17px; border-radius: 20px; }
      .below-content { width: min(100% - 24px, 760px); margin-top: -32px; }
      .support-card { padding: 15px; }
      .live-rate-tools { align-items: flex-start; }
    }

    @media (max-width: 380px) {
      .nav-action { font-size: 10px; }
      .rates-grid { grid-template-columns: 1fr; }
      .mode-button { padding: 9px 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav-inner">
      <a class="brand" href="#" aria-label="Kalkulator Kurs IDR dan PHP">
        <span class="brand-mark">↔</span>
        <span>Kurs IDR ↔ PHP</span>
      </a>
      <div class="nav-actions">
        <button type="button" class="nav-action" onclick="resetForm()">Reset</button>
      </div>
    </div>
  </header>

  <section class="hero" id="kalkulator">
    <div class="converter">
      <div class="live-rate-tools">
        <div class="live-rate-info">
          <strong id="liveRateValue">Kurs referensi: menunggu data</strong>
          <span id="liveRateStatus">Mengambil kurs otomatis...</span>
        </div>
        <button type="button" class="refresh-button" id="btnRefreshRate" onclick="perbaruiKurs()">Perbarui</button>
      </div>
      <p class="rate-value" id="displayRate">1 PHP = Rp 0</p>

      <label class="amount-label" for="inputNominal" id="labelNominal">Jumlah dalam Rupiah (IDR)</label>
      <div class="amount-box source">
        <input type="text" id="inputNominal" inputmode="numeric" placeholder="0" aria-label="Jumlah yang dikonversi" oninput="formatDanHitung(this)" />
        <div class="currency">
          <span class="currency-flag flag-id" id="flagSource" aria-label="Bendera Indonesia"></span>
          <span id="prefixNominal">Rp</span>
        </div>
      </div>
      <div class="quick-buttons" id="quickButtons" aria-label="Pilihan nominal cepat"></div>
      <div class="swap-wrap">
        <button type="button" class="swap-button" onclick="tukarArah()" aria-label="Tukar arah konversi">↕</button>
      </div>

      <label class="amount-label" id="labelHasilUtama">Dikonversi menjadi</label>
      <div class="result-amount" aria-live="polite">
        <span class="result-value" id="hasilUtama">₱ 0.00</span>
        <span class="currency">
          <span class="currency-flag flag-ph" id="flagTarget" aria-label="Bendera Filipina"></span>
          <span id="currencyTarget">PHP</span>
        </span>
      </div>

      <div class="direction-options" aria-label="Arah konversi">
        <button type="button" id="btnArahIDRtoPHP" class="direction-button active" onclick="setArah('IDR_TO_PHP')">IDR → PHP</button>
        <button type="button" id="btnArahPHPtoIDR" class="direction-button" onclick="setArah('PHP_TO_IDR')">PHP → IDR</button>
      </div>

      <div class="converter-actions">
        <button type="button" class="primary-action" onclick="salinHasil()"><span id="btnPrimaryText">Salin hasil konversi</span></button>
      </div>
      <p class="status-line" id="statusBadge">Menunggu kurs dan nominal</p>
    </div>
  </section>

  <script>
    let jenisRate = 'jual';
    let arahKonversi = 'IDR_TO_PHP';
    let nominalRaw = 0;
    const savedRate = Number(localStorage.getItem('kurs_php_reference'))
      || Number(localStorage.getItem('kurs_php_jual'))
      || Number(localStorage.getItem('kurs_php_beli'))
      || 0;
    let rateBeli = savedRate;
    let rateJual = savedRate;
    let refreshKursTimer = null;
    let sedangMemperbaruiKurs = false;
    const INTERVAL_KURS = 30 * 60 * 1000;

    window.addEventListener('DOMContentLoaded', async () => {
      if (savedRate > 0) {
        document.getElementById('liveRateValue').textContent =
          `Kurs tersimpan: 1 PHP = Rp ${savedRate.toLocaleString('id-ID', { maximumFractionDigits: 2 })}`;
        const savedDate = localStorage.getItem('kurs_php_date');
        document.getElementById('liveRateStatus').textContent = savedDate
          ? `Kurs referensi Frankfurter API • tanggal data: ${savedDate}. Sedang memeriksa pembaruan.`
          : 'Menggunakan kurs tersimpan sementara, sedang memeriksa pembaruan.';
      }
      renderQuickButtons();
      hitung();
      await perbaruiKurs();
      refreshKursTimer = window.setInterval(perbaruiKurs, INTERVAL_KURS);
    });

    async function perbaruiKurs() {
      if (sedangMemperbaruiKurs) return;

      sedangMemperbaruiKurs = true;
      const tombol = document.getElementById('btnRefreshRate');
      tombol.textContent = 'Memuat...';
      tombol.disabled = true;
      document.getElementById('liveRateStatus').textContent = 'Mengambil kurs terbaru dari Frankfurter API...';

      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch('https://api.frankfurter.dev/v1/latest?base=PHP&symbols=IDR', {
          cache: 'no-store',
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`Layanan kurs merespons HTTP ${response.status}`);

        const data = await response.json();
        const kursPasar = Number(data.rates && data.rates.IDR);
        if (!Number.isFinite(kursPasar) || kursPasar <= 0 || !/^\d{4}-\d{2}-\d{2}$/.test(data.date || '')) {
          throw new Error('Format data kurs dari layanan tidak valid');
        }

        rateBeli = kursPasar;
        rateJual = kursPasar;
        localStorage.setItem('kurs_php_reference', kursPasar.toFixed(2));
        localStorage.setItem('kurs_php_beli', rateBeli.toFixed(2));
        localStorage.setItem('kurs_php_jual', rateJual.toFixed(2));
        const tanggalKurs = new Date(`${data.date}T00:00:00Z`).toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          timeZone: 'UTC'
        });
        localStorage.setItem('kurs_php_date', tanggalKurs);
        document.getElementById('liveRateValue').textContent =
          `Referensi pasar: 1 PHP = Rp ${kursPasar.toLocaleString('id-ID', { maximumFractionDigits: 2 })}`;
        document.getElementById('liveRateStatus').textContent =
          `Frankfurter API (referensi ECB) • tanggal data: ${tanggalKurs}. Cek otomatis setiap 30 menit.`;
        hitung();
      } catch (error) {
        const message = error.name === 'AbortError'
          ? 'Permintaan kurs melewati batas waktu.'
          : error.message;
        document.getElementById('liveRateStatus').textContent =
          `Gagal memperbarui kurs: ${message}. ${rateJual > 0 ? 'Kurs tersimpan terakhir tetap digunakan.' : 'Periksa koneksi internet lalu coba lagi.'}`;
      } finally {
        window.clearTimeout(timeout);
        sedangMemperbaruiKurs = false;
        tombol.textContent = 'Perbarui';
        tombol.disabled = false;
      }
    }

    function setArah(arah) {
      arahKonversi = arah;
      const idrToPhp = arah === 'IDR_TO_PHP';
      jenisRate = idrToPhp ? 'jual' : 'beli';
      document.getElementById('btnArahIDRtoPHP').classList.toggle('active', idrToPhp);
      document.getElementById('btnArahPHPtoIDR').classList.toggle('active', !idrToPhp);
      document.getElementById('labelNominal').textContent = idrToPhp
        ? 'Jumlah dalam Rupiah (IDR)'
        : 'Jumlah dalam Peso Filipina (PHP)';
      document.getElementById('prefixNominal').textContent = idrToPhp ? 'IDR' : 'PHP';
      document.getElementById('flagSource').className = `currency-flag ${idrToPhp ? 'flag-id' : 'flag-ph'}`;
      document.getElementById('flagSource').setAttribute('aria-label', idrToPhp ? 'Bendera Indonesia' : 'Bendera Filipina');
      document.getElementById('currencyTarget').textContent = idrToPhp ? 'PHP' : 'IDR';
      document.getElementById('flagTarget').className = `currency-flag ${idrToPhp ? 'flag-ph' : 'flag-id'}`;
      document.getElementById('flagTarget').setAttribute('aria-label', idrToPhp ? 'Bendera Filipina' : 'Bendera Indonesia');
      renderQuickButtons();
      hitung();
    }

    function tukarArah() {
      setArah(arahKonversi === 'IDR_TO_PHP' ? 'PHP_TO_IDR' : 'IDR_TO_PHP');
    }

    function renderQuickButtons() {
      const container = document.getElementById('quickButtons');
      const presets = arahKonversi === 'IDR_TO_PHP'
        ? [100000, 500000, 1000000, 5000000]
        : [500, 1000, 5000, 10000];
      const prefix = arahKonversi === 'IDR_TO_PHP' ? 'Rp ' : '₱ ';

      container.innerHTML = presets.map(value => `
        <button type="button" class="quick-button" onclick="setNominalCepat(${value})">
          ${prefix}${value.toLocaleString('id-ID')}
        </button>
      `).join('');
    }

    function setNominalCepat(value) {
      nominalRaw = value;
      document.getElementById('inputNominal').value = value.toLocaleString('id-ID');
      hitung();
    }

    function formatDanHitung(input) {
      const clean = input.value.replace(/[^0-9]/g, '');
      nominalRaw = clean ? Number(clean) : 0;
      input.value = clean ? nominalRaw.toLocaleString('id-ID') : '';
      hitung();
    }

    function hitung() {
      const rateAktif = jenisRate === 'jual' ? rateJual : rateBeli;
      document.getElementById('displayRate').textContent =
        `1 PHP = Rp ${rateAktif.toLocaleString('id-ID', { maximumFractionDigits: 2 })}`;
      document.getElementById('labelHasilUtama').textContent = 'Dikonversi menjadi';
      document.getElementById('statusBadge').textContent = rateAktif > 0
        ? (nominalRaw > 0 ? 'Kurs otomatis aktif' : 'Masukkan nominal untuk menghitung total')
        : 'Menunggu kurs otomatis. Tekan Perbarui untuk mencoba lagi.';

      let hasilText;
      if (arahKonversi === 'IDR_TO_PHP') {
        const hasilPHP = rateAktif > 0 ? nominalRaw / rateAktif : 0;
        hasilText = `₱ ${hasilPHP.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      } else {
        const hasilIDR = nominalRaw * rateAktif;
        hasilText = `Rp ${Math.round(hasilIDR).toLocaleString('id-ID')}`;
      }

      document.getElementById('hasilUtama').textContent = hasilText;
    }

    function resetForm() {
      nominalRaw = 0;
      document.getElementById('inputNominal').value = '';
      hitung();
    }

    function salinHasil() {
      const kurs = document.getElementById('displayRate').textContent;
      const hasil = document.getElementById('hasilUtama').textContent;
      const teks = `Kalkulasi Kurs IDR ↔ PHP\n${kurs}\nNominal: ${document.getElementById('inputNominal').value || '0'}\nHasil konversi: ${hasil}`;

      navigator.clipboard.writeText(teks).then(() => {
        const primaryButton = document.getElementById('btnPrimaryText');
        primaryButton.textContent = 'Tersalin ke clipboard!';
        window.setTimeout(() => {
          primaryButton.textContent = 'Salin hasil konversi';
        }, 2000);
      }).catch(() => {
        document.getElementById('statusBadge').textContent = 'Tidak dapat menyalin. Periksa izin clipboard browser.';
      });
    }
  </script>
</body>
